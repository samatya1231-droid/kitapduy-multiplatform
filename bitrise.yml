format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

meta:
  bitrise.io:
    stack: osx-xcode-26.5.x
    machine_type_id: g2.mac.medium

workflows:
  ios-qa:
    title: KitapDuy iOS QA
    envs:
      - IOS_SMOKE_DEVICES: both
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - set-java-version@1:
          inputs:
            - set_java_version: '17'
      - script@1:
          title: Build KitapDuy and its XCUITest runner
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash ci/build-ios-simulator.sh
      - script@1:
          title: Record iOS user journeys
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                bash ci/test-ios-simulator.sh
      - script@1:
          title: Package the QA report and recordings
          is_always_run: true
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                if [[ -d build/ios-smoke && -n $(find build/ios-smoke -type f -print -quit) ]]; then
                  cd build/ios-smoke
                  zip -q -r -1 "$BITRISE_DEPLOY_DIR/kitapduy-ios-qa.zip" . \
                    -x '*/xcode-attachments/*' '*/journey.xcresult/*' '*/journey.xcresult.zip'
                fi
      - deploy-to-bitrise-io@2:
          inputs:
            - is_enable_public_page: 'false'
            - notify_user_groups: none

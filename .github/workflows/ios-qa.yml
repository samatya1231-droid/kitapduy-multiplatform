name: KitapDuy iOS QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitapduy-ios-qa
  cancel-in-progress: false

jobs:
  ios-qa:
    name: iPhone and iPad user journeys
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure the simulator build
        run: |
          xcodebuild -version
          xcrun simctl list devices available
          mkdir -p "$HOME/.gradle" build/ios-smoke
          # Use the runner's JDK instead of the developer's Windows JDK path.
          printf '\norg.gradle.java.home=%s\norg.gradle.workers.max=2\n' "$JAVA_HOME" >> "$HOME/.gradle/gradle.properties"
          chmod +x gradlew
          python3 ci/validate-ios-plist.py iosApp/iosApp/Info.plist

      - name: Build KitapDuy and its XCUITest runner
        env:
          KOTLIN_BUILD_LOG: ${{ github.workspace }}/build/ios-smoke/kotlin-xcode.log
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme KitapDuyUI \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee build/ios-smoke/xcode-build.log

      - name: Record iPhone and iPad user journeys
        run: bash ci/test-ios-simulator.sh

      - name: Upload the QA report and recordings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kitapduy-ios-qa
          path: |
            build/ios-smoke/
            !build/ios-smoke/**/xcode-attachments/**
            !build/ios-smoke/**/journey.xcresult/**
            !build/ios-smoke/**/journey.xcresult.zip
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3

name: KitapDuy iOS QA

on:
  workflow_dispatch:
    inputs:
      devices:
        description: "Test edilecek cihazlar (iphone: sadece iPhone, both: iPhone + iPad, ipad: sadece iPad)"
        required: false
        type: choice
        default: "iphone"
        options:
          - "iphone"
          - "both"
          - "ipad"

permissions:
  contents: read

concurrency:
  group: kitapduy-ios-qa
  cancel-in-progress: false

jobs:
  ios-qa:
    name: iOS user journeys (${{ inputs.devices || 'iphone' }})
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.5 when available
        run: |
          if [[ -d /Applications/Xcode_26.5.app/Contents/Developer ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: macos-26-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            macos-26-konan-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .spm-cache
          key: macos-26-spm-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: |
            macos-26-spm-

      - name: Build KitapDuy and its XCUITest runner
        run: bash ci/build-ios-simulator.sh

      - name: Record iOS user journeys (${{ inputs.devices || 'iphone' }})
        env:
          IOS_SMOKE_DEVICES: ${{ inputs.devices || 'iphone' }}
        run: bash ci/test-ios-simulator.sh

      - name: Upload the QA report and recordings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kitapduy-ios-qa
          path: |
            build/ios-smoke/
            !build/ios-smoke/Android/**
            !build/ios-smoke/**/xcode-attachments/**
            !build/ios-smoke/**/journey.xcresult/**
            !build/ios-smoke/**/journey.xcresult.zip
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3

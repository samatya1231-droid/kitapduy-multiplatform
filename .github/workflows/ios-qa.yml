name: KitapDuy iOS QA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kitapduy-ios-qa
  cancel-in-progress: false

jobs:
  ios-qa:
    name: iPhone and iPad user journeys
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build KitapDuy and its XCUITest runner
        run: bash ci/build-ios-simulator.sh

      - name: Record iPhone and iPad user journeys
        run: bash ci/test-ios-simulator.sh

      - name: Upload the QA report and recordings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kitapduy-ios-qa
          path: |
            build/ios-smoke/
            !build/ios-smoke/**/xcode-attachments/**
            !build/ios-smoke/**/journey.xcresult/**
            !build/ios-smoke/**/journey.xcresult.zip
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3

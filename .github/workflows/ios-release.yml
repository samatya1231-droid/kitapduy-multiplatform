name: KitapDuy iOS App Store Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Otomatik Build No (boş bırakın, her çalıştırmada kendiliğinden artar)"
        required: false
        type: string
        default: ""
      marketing_version:
        description: "Otomatik Sürüm No (boş bırakın, her çalıştırmada kendiliğinden artar)"
        required: false
        type: string
        default: ""
      upload_to_app_store:
        description: "İmzalı IPA paketini App Store Connect / TestFlight'a otomatik yükle"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: kitapduy-ios-release
  cancel-in-progress: false

jobs:
  ios-release:
    name: Build, Sign & Upload iOS IPA
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26.5 when available
        run: |
          if [[ -d /Applications/Xcode_26.5.app/Contents/Developer ]]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_26.5.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: macos-26-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            macos-26-konan-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: .spm-cache
          key: macos-26-spm-${{ hashFiles('iosApp/iosApp.xcodeproj/project.pbxproj') }}
          restore-keys: |
            macos-26-spm-

      - name: Run CI helper unit tests
        run: python3 -m unittest discover -b -s ci -p 'test_ios_release.py'

      - name: Build, sign, validate, and upload IPA
        env:
          BUNDLE_ID: com.semtinazizi.kitapduy
          UPLOAD_TO_APP_STORE: ${{ inputs.upload_to_app_store }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
          MARKETING_VERSION_INPUT: ${{ inputs.marketing_version }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: bash ci/build-ios-release.sh

      - name: Upload release IPA, dSYMs, and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: kitapduy-ios-release-${{ github.run_number }}
          path: |
            build/ios-release/ipa/*.ipa
            build/ios-release/KitapDuy.xcarchive/dSYMs/**
            build/ios-release/*.log
          if-no-files-found: warn
          compression-level: 1
          retention-days: 3

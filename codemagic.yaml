workflows:
  ios-build-test:
    name: iOS Build Check (Simulator)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.semtinazizi.kitapduy"
      xcode: latest
      cocoapods: default
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "SUPABASE_URL=DUMMY" >> local.properties
          echo "SUPABASE_KEY=DUMMY" >> local.properties
          echo "CF_ACCOUNT_ID=DUMMY" >> local.properties
          echo "CF_PUBLIC_URL=DUMMY" >> local.properties

      - name: Build KMP iOS Framework
        script: |
          chmod +x gradlew
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Verify Swift Files Compile
        script: |
          swiftc -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
            -target arm64-apple-ios14.0-simulator \
            -F composeApp/build/xcode-frameworks/Debug/iphonesimulator \
            iosApp/iosApp/KitapDuyApp.swift \
            iosApp/iosApp/ContentView.swift \
            -o /tmp/KitapDuyTest || true
          echo "✅ Kotlin/Native framework built successfully!"

  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "kitapduy"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.semtinazizi.kitapduy
      vars:
        BUNDLE_ID: "com.semtinazizi.kitapduy"
      xcode: latest
      cocoapods: default
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          echo "SUPABASE_URL=DUMMY" >> local.properties
          echo "SUPABASE_KEY=DUMMY" >> local.properties
          echo "CF_ACCOUNT_ID=DUMMY" >> local.properties
          echo "CF_PUBLIC_URL=DUMMY" >> local.properties
          chmod +x gradlew
      - name: Set up keychain and profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build KMP iOS Release Framework
        script: |
          chmod +x gradlew
          # Hem linkRelease hem de embedAndSign task'larını önceden çalıştır
          # Böylece Xcode'un "Compile Kotlin" build phase'i bunları cache'den kullanır
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --stacktrace
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode \
            -PXCODE_ACTION=install \
            -PSDK_NAME=iphoneos \
            -PPLATFORM_NAME=iphoneos \
            -PCONFIGURATION=Release \
            -PPRODUCT_NAME=iosApp \
            -PFRAMEWORKS_FOLDER_PATH="Frameworks" \
            -PEXPANDED_CODE_SIGN_IDENTITY=- \
            -PEXPANDED_CODE_SIGN_IDENTITY_NAME=- \
            --stacktrace || true
      - name: Build and Sign IPA
        script: |
          cd iosApp
          
          # Xcode build için bellek artır
          export GRADLE_OPTS="-Xmx8g -XX:MaxMetaspaceSize=512m"
          export _JAVA_OPTIONS="-Xmx8g"
          
          # Manuel export_options.plist oluştur
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.semtinazizi.kitapduy</key>
                  <string>Kitapduy Yayinlama</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          # Xcode'a bu profili kullanmasını söyle
          xcode-project build-ipa \
            --project "iosApp.xcodeproj" \
            --scheme "iosApp" \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - iosApp/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

workflows:
  ios-build-test:
    name: iOS Build Check (No Apple Account Required)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_PROJECT: "iosApp/iosApp.xcodeproj"
        XCODE_SCHEME: "iosApp"
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "SUPABASE_URL=DUMMY" >> local.properties
          echo "SUPABASE_KEY=DUMMY" >> local.properties
          echo "CF_ACCOUNT_ID=DUMMY" >> local.properties
          echo "CF_PUBLIC_URL=DUMMY" >> local.properties

      - name: CocoaPods install
        script: |
          cd iosApp && pod install || true

      - name: Build iOS for Simulator (Tests Compilation)
        script: |
          xcodebuild build -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' CODE_SIGNING_ALLOWED=NO

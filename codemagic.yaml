workflows:
  ios-build-test:
    name: iOS Build Check (Simulator)
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.semtinazizi.kitapduy"
      xcode: latest
      cocoapods: default
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true

    scripts:
      - name: Set up local.properties
        script: |
          echo "SUPABASE_URL=DUMMY" >> local.properties
          echo "SUPABASE_KEY=DUMMY" >> local.properties
          echo "CF_ACCOUNT_ID=DUMMY" >> local.properties
          echo "CF_PUBLIC_URL=DUMMY" >> local.properties

      - name: Build KMP iOS Framework
        script: |
          ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

      - name: Verify Swift Files Compile
        script: |
          swiftc -sdk $(xcrun --sdk iphonesimulator --show-sdk-path) \
            -target arm64-apple-ios14.0-simulator \
            -F composeApp/build/xcode-frameworks/Debug/iphonesimulator \
            iosApp/iosApp/KitapDuyApp.swift \
            iosApp/iosApp/ContentView.swift \
            -o /tmp/KitapDuyTest || true
          echo "✅ Kotlin/Native framework built successfully!"

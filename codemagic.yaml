workflows:
  ios-build-test:
    name: iPhone and iPad User Journey Tests
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      vars:
        BUNDLE_ID: "com.semtinazizi.kitapduy"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseG1GC"
        # Optional override via Codemagic API/UI variable groups: IOS_SMOKE_DEVICES=iphone|ipad|both (defaults to both below).
      xcode: latest
      cocoapods: default
      java: 17

    # Manual start only: automatic builds on push to main are disabled to save Codemagic minutes.

    scripts:
      - name: Set up local.properties
        script: |
          echo "SUPABASE_URL=DUMMY" >> local.properties
          echo "SUPABASE_KEY=DUMMY" >> local.properties
          echo "CF_ACCOUNT_ID=DUMMY" >> local.properties
          echo "CF_PUBLIC_URL=DUMMY" >> local.properties
          echo "CF_WORKER_URL=DUMMY" >> local.properties

      - name: Build KMP iOS Framework
        script: |
          python3 ci/validate-ios-plist.py iosApp/iosApp/Info.plist --localization tr --exact-localizations || exit 1
          chmod +x gradlew
          KOTLIN_BUILD_LOG=/tmp/kotlin-simulator.log bash ci/compile-ios.sh :composeApp:linkReleaseFrameworkIosSimulatorArm64

      - name: Build KitapDuy and XCUITest runner
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme KitapDuyUI \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-simulator \
            CODE_SIGNING_ALLOWED=NO build-for-testing 2>&1 | tee /tmp/xcode-simulator.log
          python3 ci/validate-ios-plist.py build/ios-simulator/Build/Products/Release-iphonesimulator/KitapDuy.app \
            --bundle-id "$BUNDLE_ID" --development-region tr --localization tr --exact-localizations

      - name: Test user journeys on iPhone and iPad
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          status=0
          export IOS_SMOKE_DEVICES="${IOS_SMOKE_DEVICES:-both}"
          bash ci/test-ios-simulator.sh || status=$?
          if [[ -f build/ios-smoke/index.html ]]; then
            (cd build/ios-smoke && zip -qr ../kitapduy-ios-qa.zip . -x '*/xcode-attachments/*')
          fi
          exit "$status"
        test_report: build/ios-smoke/junit.xml

    artifacts:
      - /tmp/kotlin-simulator.log
      - /tmp/kotlin-xcode.log
      - /tmp/xcode-simulator.log
      - build/kitapduy-ios-qa.zip
      - build/ios-smoke/index.html
      - build/ios-smoke/*.json
      - build/ios-smoke/*.log
      - build/ios-smoke/junit.xml
      - build/ios-smoke/iPhone/*
      - build/ios-smoke/iPad/*

  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: "kitapduy"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.semtinazizi.kitapduy
      vars:
        BUNDLE_ID: "com.semtinazizi.kitapduy"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -XX:+UseG1GC"
      xcode: latest
      cocoapods: default
      java: 17

    scripts:
      - name: Set up local.properties
        script: |
          echo "SUPABASE_URL=DUMMY" >> local.properties
          echo "SUPABASE_KEY=DUMMY" >> local.properties
          echo "CF_ACCOUNT_ID=DUMMY" >> local.properties
          echo "CF_PUBLIC_URL=DUMMY" >> local.properties
          echo "CF_WORKER_URL=DUMMY" >> local.properties
          chmod +x gradlew
      - name: Set up keychain and profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Kotlin Derlemesini Test Et (Tam Hata Gormek Icin)
        script: |
          python3 ci/validate-ios-plist.py iosApp/iosApp/Info.plist --localization tr --exact-localizations || exit 1
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6g -Dkotlin.native.jvmArgs=-Xmx6g"
          KOTLIN_BUILD_LOG=/tmp/kotlin-preflight.log bash ci/compile-ios.sh :composeApp:linkReleaseFrameworkIosArm64

      - name: Build and Sign IPA
        script: |
          set -euo pipefail
          cd iosApp
          
          # Manuel export_options.plist oluştur
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.semtinazizi.kitapduy</key>
                  <string>Kitapduy Yayinlama</string>
              </dict>
          </dict>
          </plist>
          EOF
          
          # Xcode'a bu profili kullanmasını söyle
          xcode-project build-ipa \
            --project "iosApp.xcodeproj" \
            --scheme "iosApp" \
            --export-options-plist /Users/builder/export_options.plist

      - name: Validate packaged IPA startup configuration
        script: |
          python3 ci/validate-ios-plist.py 'iosApp/build/ios/ipa/*.ipa' --development-region tr --localization tr --exact-localizations

    artifacts:
      - iosApp/build/ios/ipa/*.ipa
      - iosApp/build/ios/xcarchive/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
      - /tmp/kotlin-preflight.log
      - /tmp/kotlin-xcode.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
